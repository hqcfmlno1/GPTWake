[project]
name = "gptwake"
version = "0.1.0"
description = "Local Hey GPT wake-word detection and optional voice integration"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "sounddevice>=0.5",
    "soundfile>=0.13",
    "torch>=2.6",
    "torchaudio>=2.6",
    "tqdm>=4.67",
]

[project.optional-dependencies]
voice = ["keyring>=25.0", "openai[realtime]>=2.0"]
xlsr = ["accelerate>=1.0", "safetensors>=0.5", "transformers>=4.48,<5"]

[dependency-groups]
dev = [
    "audiomentations>=0.43.1",
    "ipykernel>=6.29",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.3",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gptwake"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# The final cell intentionally repeats imports/helpers to run in a fresh kernel.
"notebooks/02_positive_recording_augmentation.ipynb" = ["F811"]
